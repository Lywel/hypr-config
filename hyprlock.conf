general {
  hide_cursor = true
  grace = 3
  no_fade_out = true
  ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1
    blur_size = 12
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

label {
    monitor =
    text = $FPRINTFAIL
    color = rgba(250, 100, 100, 1.0)
    font_size = 15
    font_family = Noto Sans

    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi $USER, it's $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 25
    font_family = Noto Sans

    position = 0, 120
    halign = center
    valign = center
}

auth {
  pam {
    enable = true
  }
  fingerprint {
    enabled = true
  }
}

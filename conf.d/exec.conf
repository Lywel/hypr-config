# DBus and other Keyrings stuff
# Touch any of those and you'll regret it
exec-once = dbus-update-activation-environment --all
#exec-once = gnome-keyring-daemon --start --daemonize --replace
exec-once = systemctl --user import-environment QT_QPA_PLATFORMTHEME

# Hyprland scripting
exec-once = ~/.config/hypr/scripts/dynamic_float.sh

# Background SVC
exec-once = hyprpanel
exec-once = batsignal -w 9 -c 6 -d 3
exec-once = udiskie --no-automount --notify
exec-once = hypridle

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
#exec-once = secret-tool lookup type unlock-keyring && dex -as ~/.config/autostart

# Start desktop apps in ~/.config/autostart
# exec-once = wezterm start --class wezterm_hidden -- secret-tool lookup type unlock-keyring && dex -as /home/maxime/.config/autostart
#exec-once = alacritty --class wezterm_hidden -e bash ~/.config/hypr/scripts/autostart.sh
exec-once = gnome-keyring-daemon --daemonize --replace
exec-once = secret-tool lookup type unlock-keyring
exec-once = ~/.config/hypr/scripts/autostart.sh

exec-once = pypr

# Hyprland plugin
exec = hyprpm reload
# exec-once = hyprpm update

exec-once = ~/Documents/usbwatch-rs/target/release/usbwatch run --rules ~/.config/hypr/scripts/usbwatch_scrcpy.yml
exec-once = wayland-pipewire-idle-inhibit

exec-once = nm-applet

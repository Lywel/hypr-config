exec-once = uwsm finalize

exec-once = uwsm-app -- secret-tool lookup type unlock-keyring
exec-once = uwsm-app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = uwsm-app -- batsignal -w 9 -c 6 -d 3
exec-once = uwsm-app -- hyprpanel
exec-once = uwsm-app -- nm-applet
exec-once = uwsm-app -- pypr
exec-once = uwsm-app -- udiskie --no-automount --notify
exec-once = uwsm-app -- ~/.config/hypr/scripts/dynamic_float.sh
exec-once = uwsm-app -- ~/Documents/usbwatch-rs/target/release/usbwatch run --rules ~/.config/hypr/scripts/usbwatch_scrcpy.yml

exec-once = uwsm-app -- hyprpm reload -n

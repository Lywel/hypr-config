# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bindl=               , switch:Lid Switch, exec, $lock
bindl= $mainMod SHIFT, L, exec, $lock
bind = $mainMod      , ESCAPE , exec, uwsm stop
bind = SHIFT_R     , UP , exec, cd ~/Documents/linak-desk && uv run linak-controller --forward --move-to stand
bind = SHIFT_R     , DOWN , exec, cd ~/Documents/linak-desk && uv run linak-controller --forward --move-to sit

bind = $mainMod      , E      , exec, $launch $file_manager
bind = $mainMod      , SPACE  , exec, $menu
bind = $mainMod      , RETURN , exec, $launch $terminal
bind = $mainMod ALT  , RETURN , exec, $launch $browser
bind = $mainMod ALT, 1, exec, $launch gtk-launch helium-work

#bind = $mainMod      , Print  , exec, $launch grim -g "$(slurp -d)" - | wl-copy
bind = $mainMod      , Print  , exec, $launch hyprshot -m region -z
bind = $mainMod      , F6  , exec, $launch hyprshot -m region -z

bind = $mainMod      , W      , exec, hyprctl clients -j | jq -r '.[] | select(.mapped==true) | (.class + "|" + .title)' | column -s'|' --table --table-columns-limit 2 | tofi | cut -d' ' -f1 | xargs -I{} hyprctl dispatch focuswindow 'class:{}'

bind = $mainMod      , X      , exec, hyprctl kill

bind =               , Print  , exec, pgrep hyprsunset && pkill hyprsunset || hyprsunset -t 2500

bind = $mainMod      , EQUAL  , exec, hyprpanel --toggle-window=bar-0 && hyprpanel --toggle-window=bar-1
bind = $mainMod SHIFT, EQUAL  , exec, test -n "$(hyprpanel -l)" && hyprpanel -q || hyprctl dispatch exec hyprpanel

bind = $mainMod      , P      , exec, tuned-adm profile laptop-battery-powersave
bind = $mainMod SHIFT, P      , exec, tuned-adm profile balanced-battery
bind = $mainMod CTRL SHIFT, P      , exec, tuned-adm profile throughput-performance

bind = $mainMod      , G      , exec, ~/.config/hypr/scripts/gamemode.sh
bind = $mainMod SHIFT, Print  , exec, ~/.config/hypr/scripts/screen-record.sh

bind = $mainMod      , XF86AudioMedia, exec, ~/.config/hypr/scripts/yeelights.sh on &> /tmp/main.log
bind = $mainMod SHIFT, XF86AudioMedia, exec, ~/.config/hypr/scripts/yeelights.sh off &> /tmp/shift_main.log

bind = $mainMod      , R      , forcerendererreload
bind = $mainMod SHIFT, F      , fullscreen, 2
bind = $mainMod      , F      , centerwindow

bind = $mainMod      , C      , exec, pypr layout_center toggle
bind = $mainMod      , left   , exec, pypr layout_center prev
bind = $mainMod      , right  , exec, pypr layout_center next


# STARTT HY3 replacement
bind = $mainMod      , Q      , killactive,
bind = $mainMod      , down   , movefocus, d
bind = $mainMod      , left   , movefocus, l
bind = $mainMod      , h      , movefocus, l
bind = $mainMod      , right  , movefocus, r
bind = $mainMod      , l      , movefocus, r
bind = $mainMod      , j      , movefocus, d
bind = $mainMod      , k      , movefocus, u
bind = $mainMod      , up     , movefocus, u
bind = $mainMod SHIFT, 0      , movetoworkspace, 10
bind = $mainMod SHIFT, 1      , movetoworkspace, 1
bind = $mainMod SHIFT, 2      , movetoworkspace, 2
bind = $mainMod SHIFT, 3      , movetoworkspace, 3
bind = $mainMod SHIFT, 4      , movetoworkspace, 4
bind = $mainMod SHIFT, 5      , movetoworkspace, 5
bind = $mainMod SHIFT, 6      , movetoworkspace, 6
bind = $mainMod SHIFT, 7      , movetoworkspace, 7
bind = $mainMod SHIFT, 8      , movetoworkspace, 8
bind = $mainMod SHIFT, 9      , movetoworkspace, 9
bind = $mainMod ALT  , down   , movewindow, d
bind = $mainMod ALT  , h      , movewindow, l
bind = $mainMod ALT  , l      , movewindow, r
bind = $mainMod ALT  , left   , movewindow, l
bind = $mainMod ALT  , right  , movewindow, r
bind = $mainMod ALT  , up     , movewindow, u
# END Hy3 replacement
# Hy3
bind = $mainMod      , v      , hy3:makegroup, v, force_ephemeral
bind = $mainMod      , b      , hy3:makegroup, h, force_ephemeral
bind = $mainMod      , t      , hy3:makegroup, tab, toggle
bind = $mainMod      , Q      , hy3:killactive,
bind = $mainMod      , h      , hy3:movefocus, left
bind = $mainMod      , j      , hy3:movefocus, down
bind = $mainMod      , k      , hy3:movefocus, up
bind = $mainMod      , l      , hy3:movefocus, right
bind = $mainMod      , down   , hy3:movefocus, down
bind = $mainMod      , left   , hy3:movefocus, left
bind = $mainMod      , right  , hy3:movefocus, right
bind = $mainMod      , up     , hy3:movefocus, up
bind = $mainMod ALT  , h      , hy3:movewindow, left
bind = $mainMod ALT  , j      , hy3:movewindow, down
bind = $mainMod ALT  , k      , hy3:movewindow, up
bind = $mainMod ALT  , l      , hy3:movewindow, right
bind = $mainMod ALT  , down   , hy3:movewindow, down
bind = $mainMod ALT  , left   , hy3:movewindow, left
bind = $mainMod ALT  , right  , hy3:movewindow, right
bind = $mainMod ALT  , up     , hy3:movewindow, up
bind = $mainMod SHIFT, k      , hy3:changefocus, raise
bind = $mainMod SHIFT, 1      , hy3:movetoworkspace, 1, follow 
bind = $mainMod SHIFT, 2      , hy3:movetoworkspace, 2, follow
bind = $mainMod SHIFT, 3      , hy3:movetoworkspace, 3, follow
bind = $mainMod SHIFT, 4      , hy3:movetoworkspace, 4, follow
bind = $mainMod SHIFT, 5      , hy3:movetoworkspace, 5, follow
bind = $mainMod SHIFT, 6      , hy3:movetoworkspace, 6, follow
bind = $mainMod SHIFT, 7      , hy3:movetoworkspace, 7, follow
bind = $mainMod SHIFT, 8      , hy3:movetoworkspace, 8, follow
bind = $mainMod SHIFT, 9      , hy3:movetoworkspace, 9, follow

#bind = $mainMod      , Z      , exec, pypr zoom ++0.4
bind = $mainMod      , Z      , exec, pypr zoom ++0.17
bind = $mainMod SHIFT, Z      , exec, pypr zoom
bind = $mainMod      , semicolon, exec, pypr menu
# bind = ALT_R         , B      , plugin:xtd:moveorexec, class:^(Beeper)$, beeper
bind = ALT_R         , B      , exec, pypr toggle beeper
bind = ALT_R         , M      , exec, pypr toggle betterbird
bind = $mainMod      , O      , togglefloating,
bind = $mainMod      , SLASH  , layoutmsg
bind = $mainMod      , 1      , workspace, 1
bind = $mainMod      , 0      , workspace, 10
bind = $mainMod      , 2      , workspace, 2
bind = $mainMod      , 3      , workspace, 3
bind = $mainMod      , 4      , workspace, 4
bind = $mainMod      , 5      , workspace, 5
bind = $mainMod      , 6      , workspace, 6
bind = $mainMod      , 7      , workspace, 7
bind = $mainMod      , 8      , workspace, 8
bind = $mainMod      , 9      , workspace, 9
bind = $mainMod CTRL , right  , workspace, e+1
bind = $mainMod CTRL , l      , workspace, e+1
bind = $mainMod CTRL , left   , workspace, e-1
bind = $mainMod CTRL , h      , workspace, e-1

gesture = 3, horizontal, workspace

# Example special workspace (scratchpad)
bind = $mainMod      , S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, S, exec, pypr toggle_special magic
# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up  , workspace, e-1
# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, Control_L, movewindow
bindm = $mainMod, mouse:273, resizewindow 1
bindm = $mainMod, ALT_L    , resizewindow
# Media Keys
bindl =  , XF86AudioNext        , exec, playerctl next 
bindl =  , XF86AudioPlay        , exec, playerctl play-pause
bindl =  , XF86AudioPrev        , exec, playerctl previous
bindl =  , XF86AudioMute        , exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindle = , XF86AudioLowerVolume , exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindle = , XF86AudioRaiseVolume , exec, wpctl set-volume --limit 1 @DEFAULT_AUDIO_SINK@ 5%+
bindle = , XF86MonBrightnessDown, exec, brightnessctl --device='intel_backlight' --exponent=3 --min-value=1 set 5%-
bindle = , XF86MonBrightnessUp  , exec, brightnessctl --device='intel_backlight' --exponent=3 set +5%

# Disable all key binding
bind = $mainMod SHIFT, GRAVE, submap, clean
submap = clean
bind = $mainMod SHIFT, GRAVE, submap, reset
submap = reset

bind = ALT, TAB, cyclenext

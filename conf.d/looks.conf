# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 3
    gaps_out = 6

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true
    # extend_border_grab_area = 32

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = hy3
}

render {
  direct_scanout = 1
  new_render_scheduling = true
}

cursor {
  hide_on_key_press = true
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 18

    # Change transparency of focused and unfocused windows
    # active_opacity = 1
    # inactive_opacity = 0.95

    shadow {
      enabled = true
      range = 16
      render_power = 3
    	color = rgba(1a1a1aee)
    }
    blur {
        enabled = true
        size = 12
        passes = 1
        brightness = .5
        contrast = 1.3
        vibrancy = 1
        vibrancy_darkness = .5
        # noise = 0
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more
    # bezier = easeInOutBack, 0.68, -0.1, 0.32, 1.1

    # animation = windows, 1, 20, default, popin 80%
    # animation = windowsOut, 1, 3, default, popin 80%
    # animation = border, 1, 3, default
    # animation = borderangle, 1, 3, default
    # animation = fade, 1, 3, default
    # animation = workspaces, 1, 3, default
    # animation = specialWorkspace, 1, 4, default, slidevert 

    
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 5, smoothOut, slide
    animation = windowsMove, 1, 5, default
    animation = border, 1, 5, default
    animation = fade, 1, 3, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 5, default
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
    force_split = 2
    default_split_ratio = 1.3
    special_scale_factor = 0.96
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    mfact = 0.73
    allow_small_split = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    # Set to 0 or 1 to disable the anime mascot wallpapers
    force_default_wallpaper = -1
    # If true disables the random hyprland logo / anime girl background. :(
    disable_hyprland_logo = false
    on_focus_under_fullscreen = 2
    vfr = true
}

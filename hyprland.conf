debug:disable_logs = false

$launch = uwsm-app --
$terminal = alacritty
$file_manager = nautilus
$menu = $launch $(tofi-drun)
$browser = helium
$lock = loginctl lock-session

source = ~/.config/hypr/conf.d/hyprspace.conf
source = ~/.config/hypr/conf.d/hy3.conf

source = ~/.config/hypr/conf.d/exec.conf
source = ~/.config/hypr/conf.d/inputs.conf
source = ~/.config/hypr/conf.d/keybinds.conf
source = ~/.config/hypr/conf.d/looks.conf
source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/windowrules.conf

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
